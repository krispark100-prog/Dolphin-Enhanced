name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipo de build (release = optimizado, recomendado; debug = lento)"
        type: choice
        default: release
        options:
          - release
          - debug
  push:
    branches: [ master, main ]
    paths:
      - "Source/**"
      - ".github/scripts/**"
      - "CMakeLists.txt"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout (con submódulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Localizar proyecto Android
        id: find
        run: |
          GRADLEW="$(find . -path '*/Source/Android/gradlew' -not -path '*/node_modules/*' | head -1)"
          if [ -z "$GRADLEW" ]; then echo "No se encontró Source/Android/gradlew"; exit 1; fi
          ANDROID_DIR="$(cd "$(dirname "$GRADLEW")" && pwd)"
          ROOT_DIR="$(cd "$ANDROID_DIR/../.." && pwd)"
          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"
          echo "root_dir=$ROOT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android: $ANDROID_DIR"
          echo "Raíz:    $ROOT_DIR"

      # Si el fork se creó subiendo un zip, los submódulos quedan como carpetas vacías.
      - name: Completar submódulos vacíos
        working-directory: ${{ steps.find.outputs.root_dir }}
        run: |
          fetch() {
            dir="$1"; url="$2"
            if [ -z "$(ls -A "$dir" 2>/dev/null)" ]; then
              echo "Clonando $url en $dir"
              rm -rf "$dir"
              git clone --depth 1 --recursive "$url" "$dir"
            else
              echo "$dir OK"
            fi
          }
          fetch Externals/libadrenotools https://github.com/bylaws/libadrenotools.git
          fetch Externals/Vulkan-Headers https://github.com/KhronosGroup/Vulkan-Headers.git

      - name: Aplicar correcciones sobre los archivos del fork
        run: python3 .github/scripts/apply_fixes.py "${{ steps.find.outputs.root_dir }}"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK / NDK / CMake
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        working-directory: ${{ steps.find.outputs.android_dir }}
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'release' }}
        run: |
          chmod +x gradlew
          if [ "$BUILD_TYPE" = "debug" ]; then TASK=assembleDebug; else TASK=assembleRelease; fi
          ./gradlew "$TASK" --no-daemon --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-Enhanced-APK
          path: ${{ steps.find.outputs.android_dir }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
